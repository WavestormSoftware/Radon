<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Radon demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #eee; font: 14px system-ui, sans-serif; }
  #canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  #status { position: fixed; left: 12px; bottom: 12px; opacity: .6; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); },
    setStatus: function (t) { document.getElementById('status').textContent = t; },
  };
</script>

</body>
</html>
